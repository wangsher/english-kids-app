  <style id="mobile-audio-fix-styles">
    .lesson-audio-panel{background:#F0F9FF;border:2px solid #BAE6FD;border-radius:20px;padding:16px;margin-bottom:20px;color:#4A3F35}
    .lesson-audio-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
    .lesson-audio-test,.lesson-audio-retry{min-height:48px;border-radius:14px;padding:10px 18px;font-size:17px;font-weight:800;cursor:pointer;touch-action:manipulation}
    .lesson-audio-test{background:#0369A1;color:white;border:2px solid #0369A1;flex-shrink:0}
    .lesson-audio-retry{background:white;border:2px solid #0369A1;color:#075985}
    .lesson-audio-test:focus-visible,.lesson-audio-retry:focus-visible,.lesson-audio-help summary:focus-visible{outline:3px solid #7C3AED;outline-offset:3px}
    #lesson-audio-status{font-size:16px;line-height:1.6;flex:1;min-width:180px;overflow-wrap:anywhere}
    #lesson-audio-status[data-state="error"]{color:#9F1239}
    .lesson-audio-help{margin-top:10px;font-size:15px;line-height:1.7}
    .lesson-audio-help summary{cursor:pointer;min-height:36px;color:#075985;font-weight:700;width:fit-content}
    .lesson-audio-help ul{list-style:disc;padding-left:22px;margin:6px 0 0}
    .lesson-audio-help li+li{margin-top:5px}
    @media(max-width:480px){#lesson-audio-status{flex-basis:100%}.lesson-audio-panel{padding:14px}}
  </style>
</head>

/* Mobile audio fix, 2026-09-25.
 * The fixed lesson vocabulary uses embedded MP3 recordings. No network request,
 * speechSynthesis voice pack, or external audio file is required.
 * Keep play() inside the original click handler: do not await loading or voices.
 */
const lessonAudio = (() => {
  const subscribers = new Set();
  let player = null;
  let requestId = 0;
  let startupTimer = null;
  let active = false;
  let lastWord = "one";
  let snapshot = {
    state: "ready",
    message: "先按「測試聲音」聽聽看，也可以直接點卡片播放。"
  };

  function publish(state, message) {
    snapshot = { state, message };
    subscribers.forEach(listener => listener(snapshot));
  }

  function clearTimer() {
    if (startupTimer !== null) window.clearTimeout(startupTimer);
    startupTimer = null;
  }

  function getPlayer() {
    if (!player) {
      // Reuse one element on Safari/iOS instead of creating one per tap.
      player = document.createElement("audio");
      player.id = "lesson-audio-player";
      player.preload = "auto";
      player.hidden = true;
      player.setAttribute("aria-hidden", "true");
      player.setAttribute("playsinline", "");
      player.setAttribute("webkit-playsinline", "");
      document.body.appendChild(player);
    }
    return player;
  }

  function stop() {
    requestId += 1;
    clearTimer();
    active = false;
    if (player) {
      player.onplaying = null;
      player.onended = null;
      player.onerror = null;
      player.pause();
    }
  }

  function play(word) {
    const key = String(word).trim().toLowerCase();
    const source = LESSON_AUDIO_CLIPS[key];
    stop();
    if (!source) {
      publish("error", "這個項目還沒有發音音檔，請選擇數字 1–10 或字母 A–J。");
      return;
    }

    lastWord = key;
    const currentRequest = requestId;
    const audio = getPlayer();
    active = true;
    publish("loading", "正在準備播放…");

    function finish(state, message) {
      if (currentRequest !== requestId || !active) return;
      // Invalidate promise callbacks and queued events from this request.
      stop();
      publish(state, message);
    }

    function failed(error) {
      if (currentRequest !== requestId || !active) return;
      if (error && error.name === "NotAllowedError") {
        finish("error", "播放被瀏覽器暫停了，請按「重試聲音」；若仍無聲，請用 Safari 或 Chrome 開啟。");
      } else {
        finish("error", "聲音未能播放，請按「重試聲音」，或展開下方的「聽不到聲音？」。");
      }
    }

    audio.onplaying = () => {
      if (currentRequest !== requestId || !active) return;
      if (audio.paused) return;
      clearTimer();
      // Do not reveal the current word: it may be a listening quiz answer.
      publish("playing", "聲音播放中…");
    };
    audio.onended = () => {
      if (audio.ended) finish("ready", "發音播放完畢，可以點卡片繼續練習。");
    };
    audio.onerror = () => {
      if (audio.error) failed(audio.error);
    };

    startupTimer = window.setTimeout(() => {
      finish("error", "聲音尚未啟動，請按「重試聲音」，並確認媒體音量已調高。");
    }, 8000);

    try {
      audio.muted = false;
      audio.volume = 1;
      // Loading a new source also resets playback for repeated taps.
      audio.src = source;
      audio.load();
      // IMPORTANT: this is synchronous with the user's click, including on iOS.
      const result = audio.play();
      if (result && typeof result.catch === "function") result.catch(failed);
    } catch (error) {
      failed(error);
    }
  }

  function suspend() {
    const wasActive = active;
    stop();
    if (wasActive) publish("ready", "已暫停聲音，回到頁面後再點卡片即可播放。");
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) suspend();
  });
  window.addEventListener("pagehide", suspend);

  return {
    play,
    test: () => play("one"),
    retry: () => play(lastWord),
    stop: suspend,
    getSnapshot: () => snapshot,
    subscribe(listener) {
      subscribers.add(listener);
      listener(snapshot);
      return () => subscribers.delete(listener);
    }
  };
})();

function kt(word) {
  lessonAudio.play(word);
}

function LessonAudioPanel() {
  const [status, setStatus] = Q.useState(lessonAudio.getSnapshot);
  Q.useEffect(() => lessonAudio.subscribe(setStatus), []);
  return C("section", {
    className: "lesson-audio-panel",
    "aria-label": "聲音設定",
    children: [
      C("div", {
        className: "lesson-audio-row",
        children: [
          m("button", {
            type: "button",
            className: "lesson-audio-test",
            onClick: lessonAudio.test,
            children: "🔊 測試聲音"
          }),
          m("p", {
            id: "lesson-audio-status",
            role: "status",
            "aria-live": "polite",
            "aria-atomic": "true",
            "data-state": status.state,
            children: status.message
          }),
          status.state === "error" && m("button", {
            type: "button",
            className: "lesson-audio-retry",
            onClick: lessonAudio.retry,
            children: "重試聲音"
          })
        ]
      }),
      C("details", {
        className: "lesson-audio-help",
        children: [
          m("summary", { children: "聽不到聲音？" }),
          C("ul", {
            children: [
              m("li", { children: "按「測試聲音」會播放 one。請在播放時調高手機的媒體音量。" }),
              m("li", { children: "確認聲音是否輸出到藍牙耳機，並檢查裝置與網頁的靜音設定。" }),
              m("li", { children: "若在 LINE、Facebook 或檔案預覽中無聲，請改用 iPhone／iPad 的 Safari，或 Android 的 Chrome 開啟。" }),
              m("li", { children: "數字與字母的發音已包含在這份檔案裡，不需要另外下載語音包。" })
            ]
          })
        ]
      })
    ]
